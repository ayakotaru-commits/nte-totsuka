# マルチプレイのサーバー (server/) を Cloudflare Workers に公開する。手動で実行したときだけ動く。
# 準備と使い方は server/README.md。リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が要る。
name: マルチプレイのサーバーを公開
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: サーバーの確認 (通信なし)
        run: node server/test.js
      - name: Cloudflare に公開
        working-directory: server
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
