# Cloudflare Workers の設定 (無料プランで動く構成)。公開のしかたは README.md
name = "totsuka-mp"
main = "worker.js"
compatibility_date = "2025-04-01"

# 無料プランで使える Durable Object は SQLite 型だけ (保存の機能は使っていない)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[vars]
# 接続を受け付けるページ (カンマ区切り)。ほかのサイトに無料枠を使われないようにする。localhost は常に可。"*" で制限なし
ALLOWED_ORIGINS = "https://ayakotaru-commits.github.io"
